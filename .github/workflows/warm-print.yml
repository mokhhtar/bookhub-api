# Push every book's printable edition to Cloudflare R2.
#
# WHY. /print/ currently reads the whole book through Render: measured 14.5s
# total for a 788KB book WITH a warm Redis cache and a warm instance, and
# another 30-60s on top when Render is asleep. The document is identical every
# time and there are only ~36 of them, so serving it from Render at all is the
# mistake. This uploads each one once; the site then reads a static file from
# Cloudflare's edge and falls back to the API only on a miss.
#
# It is a paced crawl of our own API, exactly like warm-daily.yml — Render's
# free tier has no cron, and this needs the API anyway to produce the
# sanitised HTML.
#
# RUN IT WHEN: PRINT_KEY in tools/reader.py is bumped (the sanitiser changed,
# so every stored document is stale), or new Gutenberg-backed book pages are
# published. Manual only — there is nothing to schedule, the content is fixed.
#
# REQUIRES these repo secrets:
#   R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY — the S3 credentials shown once
#     when an R2 API token is created, with "Object Read & Write" scoped to
#     this bucket alone. NOT a REST bearer token: that permission is
#     documented as supported by the S3 API only, and the REST endpoint
#     answers 403 for it.
#   CLOUDFLARE_ACCOUNT_ID
name: Warm printable editions to R2

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: "R2 bucket name"
        default: "litheca-print"
      limit:
        description: "Stop after N books (0 = all). Use 1 as a canary FIRST."
        default: "1"

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version lives in one place — the sanitiser that produces the
      # document. Deriving it here rather than hardcoding means the upload
      # path cannot silently disagree with what the parser produced.
      - name: Read the print cache version
        id: ver
        run: |
          # POSIX sed, not grep -P: -P is a GNU extension and refuses to run
          # outside a UTF-8 locale, so it works on the runner and fails on a
          # laptop. A build step that only works in one place is a build step
          # nobody can debug.
          V=$(sed -n 's/^PRINT_KEY[[:space:]]*=[[:space:]]*"readprint_\([a-z0-9]*\)".*/\1/p' tools/reader.py)
          if [ -z "$V" ]; then echo "Could not read PRINT_KEY from tools/reader.py"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Uploading under print/$V/"
          echo "NOTE: bookhub/_config.yml must carry print_version: \"$V\" or the site will miss every object."

      # Render sleeps after ~15 minutes. Wake it before the real calls so the
      # first book doesn't eat the cold start inside a longer timeout.
      - name: Wake the API
        run: curl -sS -m 120 --retry 3 --retry-delay 10 "https://bookhub-api-hnv7.onrender.com/health" || true

      - name: Upload each printable edition
        env:
          # S3 credentials, not a REST bearer token — see the header.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # R2 does not implement the newer default checksum headers the AWS
          # CLI v2 sends; asking for them only when required keeps put-object
          # from failing on a header R2 will never return.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ inputs.bucket }}
          VERSION: ${{ steps.ver.outputs.version }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -uo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY are not set."
            echo "Both are shown once, on the R2 API token screen, at creation."
            exit 1
          fi
          ENDPOINT="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"

          # books.json is the site's own machine-readable index — the same list
          # the site renders from, so it cannot drift from what is published.
          curl -sS -m 60 --retry 3 "https://litheca.com/books.json" -o books.json
          mapfile -t IDS < <(jq -r '.[] | select(.gutenberg_id != null and .gutenberg_id != "") | .gutenberg_id' books.json | sort -un)
          echo "${#IDS[@]} book(s) carry a Gutenberg id."
          [ "${#IDS[@]}" -eq 0 ] && { echo "Nothing to do."; exit 0; }

          ok=0; skipped=0; failed=0; n=0
          for GID in "${IDS[@]}"; do
            if [ "$LIMIT" != "0" ] && [ "$n" -ge "$LIMIT" ]; then break; fi
            n=$((n+1))
            echo "::group::$GID"

            # The API produces the sanitised document. Extracting .html with jq
            # also proves the response was well-formed JSON.
            if ! curl -sS -m 300 "https://bookhub-api-hnv7.onrender.com/read/$GID/print" -o resp.json; then
              echo "fetch failed"; failed=$((failed+1)); echo "::endgroup::"; continue
            fi
            if ! jq -er '.html' resp.json > book.html 2>/dev/null; then
              echo "no printable edition (API returned no html)"; skipped=$((skipped+1)); echo "::endgroup::"; continue
            fi
            SIZE=$(wc -c < book.html)
            # Same floor the API applies before storing anything: a document
            # that sanitises down to nothing is a failure, not a short book.
            if [ "$SIZE" -lt 2000 ]; then
              echo "suspiciously small ($SIZE bytes) — refusing"; failed=$((failed+1)); echo "::endgroup::"; continue
            fi

            # Third mechanism, and the trail is worth keeping because each
            # failed differently:
            #   wrangler r2 object put — reported success, wrote to a LOCAL
            #     simulator. Exit 0, zero objects stored.
            #   Cloudflare REST API — 403 "Authentication error" for a token
            #     scoped exactly right, because R2's "Object Read & Write"
            #     permission is documented as supported by the S3 API ONLY.
            #   S3 endpoint — what this token was actually made for.
            KEY="print/$VERSION/$GID.html"
            if ! aws s3api put-object \
                 --endpoint-url "$ENDPOINT" \
                 --bucket "$BUCKET" --key "$KEY" \
                 --body book.html \
                 --content-type "text/html; charset=utf-8" \
                 --cache-control "public, max-age=31536000, immutable" \
                 >put.json 2>put.err; then
              echo "upload failed"; sed -n "1,4p" put.err
              failed=$((failed+1)); echo "::endgroup::"; continue
            fi

            echo "uploaded $KEY ($SIZE bytes)"
            # Hand the verifier a key we KNOW was written, rather than let it
            # recompute one. It used to derive the key by re-sorting books.json
            # with jq's string sort while this loop uses `sort -un`, so at
            # limit=1 the upload wrote 12.html and the check looked for
            # 103.html — "103" < "12" as text, 12 < 103 as numbers. It failed,
            # correctly, on an object nobody had claimed to store.
            [ "$ok" -eq 0 ] && echo "VERIFY_KEY=$KEY" >> "$GITHUB_ENV"
            ok=$((ok+1))
            echo "::endgroup::"
            sleep 3   # Render's free tier is not in a hurry and neither are we
          done

          echo "uploaded=$ok  skipped=$skipped  failed=$failed"
          echo "uploaded=$ok" >> "$GITHUB_ENV"
          [ "$failed" -gt 0 ] && exit 1
          exit 0

      # Uploading is not the same as being stored, and being stored is not the
      # same as being readable. This step checks BOTH, and it is not optional.
      #
      # It used to skip itself with a friendly note when PRINT_CDN was unset —
      # and that is exactly what happened on the first real run, while wrangler
      # was silently writing to a local simulator. The one check that would
      # have caught it excused itself, and the job went green having stored
      # nothing. A check that can decline to run is not a check.
      - name: Verify the objects are really there, and really public
        if: ${{ success() }}
        env:
          # Same S3 credentials as the upload — the REST API rejects this
          # token, and a verification that cannot authenticate is a
          # verification that fails for the wrong reason.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ inputs.bucket }}
          # The bucket's public hostname is public by definition — it is in
          # every page that reads from it. Requiring it to be configured added
          # a failure mode and bought no secrecy, and it duly failed twice:
          # once unset, once set as a Secret when `vars` reads Variables. The
          # repo variable still overrides, for a rename or a second bucket.
          CDN: ${{ vars.PRINT_CDN || 'https://files.litheca.com' }}
        run: |
          set -uo pipefail
          ENDPOINT="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
          KEY="${VERIFY_KEY:-}"
          if [ -z "$KEY" ]; then
            echo "::error::The upload step recorded no key — nothing was stored."
            echo "Every book was skipped or failed. Read the upload step's summary line."
            exit 1
          fi

          # 1. Does the object exist in the bucket, at the size we sent?
          if ! aws s3api head-object --endpoint-url "$ENDPOINT" \
               --bucket "$BUCKET" --key "$KEY" >head.json 2>head.err; then
            echo "::error::$KEY is NOT in the bucket. The upload reported success and stored nothing."
            sed -n "1,4p" head.err
            exit 1
          fi
          echo "stored: $KEY $(jq -r '.ContentLength' head.json) bytes, $(jq -r '.ContentType' head.json)"

          # 2. Can the browser actually read it? A bucket with no custom domain
          #    or no public access passes step 1 and serves nobody.
          if [ -z "${CDN:-}" ]; then
            echo "::error::PRINT_CDN repo variable is not set, so the public read cannot be checked."
            echo "Set it to the bucket's custom domain (e.g. https://files.litheca.com)."
            exit 1
          fi
          URL="$CDN/$KEY"
          READ=$(curl -sS -o /dev/null -m 60 -H "Origin: https://litheca.com" \
                 -w '%{http_code} %{time_starttransfer} %{time_total} %{size_download}' "$URL")
          set -- $READ
          echo "$URL -> HTTP $1 | first byte ${2}s | total ${3}s | $4 bytes"
          [ "$1" = "200" ] || { echo "::error::Public read failed ($1). Is the bucket public with a custom domain?"; exit 1; }

          # The point of the whole exercise, measured rather than asserted.
          # Through Render the same document took 14.3s total for 788KB with a
          # warm Redis cache and a warm instance; the number above is what it
          # costs now. Printed on every run so a regression shows up as a
          # number instead of a feeling — and measured from the runner because
          # the machine this was developed on cannot route to Cloudflare's edge
          # at all, which is exactly why a local measurement would have lied.
          {
            echo "### Printable editions"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Verified object | \`$KEY\` |"
            echo "| Public read | HTTP $1, ${3}s total, $4 bytes |"
            echo "| Same document via Render (measured 2026-08-02) | 14.3s total for 788KB |"
          } >> "$GITHUB_STEP_SUMMARY"
