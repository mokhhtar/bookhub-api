services:
  - type: web
    name: bookhub-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false        # set manually in Render dashboard — never commit secrets
      - key: GOOGLE_BOOKS_API_KEY
        sync: false        # optional — works without one at low volume, raises rate limits if set
      - key: AMAZON_TAG
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: AMAZON_CREDENTIAL_ID
        sync: false
      - key: AMAZON_CREDENTIAL_SECRET
        sync: false
      - key: AMAZON_PARTNER_TAG
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false        # Upstash Redis REST endpoint — daily picks + response cache
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: GITHUB_PAT
        sync: false        # fine-grained PAT, contents:write on the bookhub repo only
      - key: GITHUB_REPO
        sync: false        # e.g. mokhhtar/bookhub
      - key: GITHUB_BRANCH
        sync: false        # e.g. main
      - key: GITHUB_PUBLISH_ENABLED
        sync: false        # "true" to enable static-page commits
    healthCheckPath: /health
